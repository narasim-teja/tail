<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The ring of targets</title>
<desc id="d">Five players in a loop: Ana hunts Bo, Bo hunts Cy, Cy hunts Dee, Dee hunts Eli, Eli hunts Ana. When Ana tags Bo, Bo is out and Ana now hunts Cy.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A79F96"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EE6A3F"/></marker>
</defs>
<rect width="960" height="470" rx="16" fill="#1C2430"/>
<text x="40" y="52" font-size="19" font-weight="700" fill="#F1ECE5" text-anchor="start">At the start</text>
<text x="40" y="78" font-size="15" font-weight="400" fill="#A79F96" text-anchor="start">A secret draw links everyone in one loop.</text>
<text x="40" y="99" font-size="15" font-weight="400" fill="#A79F96" text-anchor="start">You only see your own arrow.</text>
<path d="M263.5 155.1 A112 112 0 0 1 321.3 197.1" fill="none" stroke="#EE6A3F" stroke-width="3" marker-end="url(#ah)"/>
<path d="M342.0 260.8 A112 112 0 0 1 319.9 328.8" fill="none" stroke="#A79F96" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#a)"/>
<path d="M265.7 368.1 A112 112 0 0 1 194.3 368.1" fill="none" stroke="#A79F96" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#a)"/>
<path d="M140.1 328.8 A112 112 0 0 1 118.0 260.8" fill="none" stroke="#A79F96" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#a)"/>
<path d="M138.7 197.1 A112 112 0 0 1 196.5 155.1" fill="none" stroke="#A79F96" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#a)"/>
<circle cx="230.0" cy="150.0" r="27" fill="#EE6A3F" stroke="#EE6A3F" stroke-width="2"/>
<text x="230" y="155" font-size="15" font-weight="600" fill="#1C1410" text-anchor="middle">Ana</text>
<circle cx="336.5" cy="227.4" r="27" fill="#243040" stroke="#3A4757" stroke-width="2"/>
<text x="336.5183298250572" y="232.3900966300059" font-size="15" font-weight="600" fill="#F1ECE5" text-anchor="middle">Bo</text>
<circle cx="295.8" cy="352.6" r="27" fill="#243040" stroke="#3A4757" stroke-width="2"/>
<text x="295.83194825675696" y="357.60990336999413" font-size="15" font-weight="600" fill="#F1ECE5" text-anchor="middle">Cy</text>
<circle cx="164.2" cy="352.6" r="27" fill="#243040" stroke="#3A4757" stroke-width="2"/>
<text x="164.16805174324304" y="357.60990336999413" font-size="15" font-weight="600" fill="#F1ECE5" text-anchor="middle">Dee</text>
<circle cx="123.5" cy="227.4" r="27" fill="#243040" stroke="#3A4757" stroke-width="2"/>
<text x="123.4816701749428" y="232.39009663000587" font-size="15" font-weight="600" fill="#F1ECE5" text-anchor="middle">Eli</text>
<line x1="480" y1="40" x2="480" y2="430" stroke="#3A4757" stroke-width="1"/>
<text x="520" y="52" font-size="19" font-weight="700" fill="#F1ECE5" text-anchor="start">Ana tags Bo</text>
<text x="520" y="78" font-size="15" font-weight="400" fill="#A79F96" text-anchor="start">Bo is out. Bo's target, Cy, becomes</text>
<text x="520" y="99" font-size="15" font-weight="400" fill="#A79F96" text-anchor="start">Ana's. Bo's money moves to Ana.</text>
<path d="M743.5 155.1 A112 112 0 0 1 799.9 328.8" fill="none" stroke="#EE6A3F" stroke-width="3" marker-end="url(#ah)"/>
<path d="M745.7 368.1 A112 112 0 0 1 674.3 368.1" fill="none" stroke="#A79F96" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#a)"/>
<path d="M620.1 328.8 A112 112 0 0 1 598.0 260.8" fill="none" stroke="#A79F96" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#a)"/>
<path d="M618.7 197.1 A112 112 0 0 1 676.5 155.1" fill="none" stroke="#A79F96" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#a)"/>
<circle cx="710.0" cy="150.0" r="27" fill="#EE6A3F" stroke="#EE6A3F" stroke-width="2"/>
<text x="710" y="155" font-size="15" font-weight="600" fill="#1C1410" text-anchor="middle">Ana</text>
<circle cx="816.5" cy="227.4" r="27" fill="#1C2430" stroke="#5D6672" stroke-width="2" stroke-dasharray="4 4"/>
<text x="816.5183298250572" y="232.3900966300059" font-size="15" font-weight="600" fill="#5D6672" text-anchor="middle">Bo</text><line x1="800.5183298250572" y1="211.3900966300059" x2="832.5183298250572" y2="243.3900966300059" stroke="#5D6672" stroke-width="2"/>
<circle cx="775.8" cy="352.6" r="27" fill="#243040" stroke="#3A4757" stroke-width="2"/>
<text x="775.831948256757" y="357.60990336999413" font-size="15" font-weight="600" fill="#F1ECE5" text-anchor="middle">Cy</text>
<circle cx="644.2" cy="352.6" r="27" fill="#243040" stroke="#3A4757" stroke-width="2"/>
<text x="644.168051743243" y="357.60990336999413" font-size="15" font-weight="600" fill="#F1ECE5" text-anchor="middle">Dee</text>
<circle cx="603.5" cy="227.4" r="27" fill="#243040" stroke="#3A4757" stroke-width="2"/>
<text x="603.4816701749428" y="232.39009663000587" font-size="15" font-weight="600" fill="#F1ECE5" text-anchor="middle">Eli</text>
<text x="480" y="448" font-size="13" font-weight="400" fill="#A79F96" text-anchor="middle">Solid orange: the one arrow you can see. Dashed: everyone else's, hidden from you.</text>
</svg>
