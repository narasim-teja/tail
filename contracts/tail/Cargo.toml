[package]
name = "tail-contract"
version = "0.1.0"
description = "TAIL custody and settlement: internal balances, stakes, referee-signed verdicts."
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
# Default features only: messages, verdict digest, players hash, ring commit (SHA-256, no HMAC or
# sealing), so the wasm stays small and the bytes are the ones the TS side and referee use.
tail-protocol = { path = "../../crates/tail-protocol" }
borsh = "1"
hex = "=0.4.3"
# Decompression and the torsion check that reject small-order referee and VRF keys.
curve25519-dalek = { version = "=4.1.3", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
ed25519-dalek = "=2.2.0"
serde_json = "1"

# The contract is its own workspace (cargo near builds it for wasm32-unknown-unknown), so it
# cannot inherit the root lint table; this is a copy of it.
[workspace]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
doc_markdown = "allow"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# The conservation property test runs thousands of mocked calls; optimised dependencies (ed25519,
# SHA-256, the mocked VM) keep `cargo test` quick while the contract itself stays debuggable.
[profile.dev.package."*"]
opt-level = 2
