<!doctype html>
<!--
  The site's 404, served by Cloudflare (wrangler.jsonc: not_found_handling "404-page") for any
  address with no file and no rewrite. Self-contained: the app's paper and ink, the Trail mark,
  and two ways back. Colours from @tail/brand.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FBF7F1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Page not found · TAIL</title>
    <style>
      :root {
        --paper: #fbf7f1;
        --sand: #f3ece3;
        --sand-hover: #ebe2d6;
        --ink: #2b211c;
        --mute: #6e655d;
        --persimmon: #ee6a3f;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
      }
      body {
        font: 500 1.0625rem/1.5 "Archivo Variable", "Archivo", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        padding: 16px clamp(16px, 4vw, 64px) 0;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        color: inherit;
        text-decoration: none;
        font-weight: 900;
        font-size: 1.125rem;
        letter-spacing: 0.08em;
      }
      main {
        align-self: center;
        width: 100%;
        max-width: 44rem;
        padding: 48px clamp(16px, 4vw, 64px) 96px;
      }
      .code {
        margin: 0 0 16px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1167em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .trail {
        display: block;
        width: min(220px, 50vw);
        height: auto;
        margin: 0 0 32px -6px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 1.6rem + 3vw, 4rem);
        line-height: 1.02;
        font-weight: 900;
        letter-spacing: -0.033em;
        text-wrap: balance;
      }
      p.lede {
        margin: 24px 0 0;
        max-width: 32rem;
        font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.25rem);
        color: var(--mute);
        text-wrap: pretty;
      }
      .actions {
        margin-top: 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 24px;
        border-radius: 16px;
        background: var(--ink);
        color: var(--paper);
        font-weight: 700;
        text-decoration: none;
        transition: transform 240ms var(--ease), background-color 240ms var(--ease);
      }
      .button:active {
        transform: scale(0.98);
      }
      .button.sand {
        background: var(--sand);
        color: var(--ink);
      }
      .button.sand:hover {
        background: var(--sand-hover);
      }
      :focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 3px;
        border-radius: 10px;
      }
      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="TAIL, home">
        <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <path d="M33.8 11.8 Q14 30 7 57 Q30 46 52.2 30.2 Z" fill="#EE6A3F" fill-opacity="0.38" />
          <circle cx="43" cy="21" r="13" fill="#EE6A3F" />
        </svg>
        TAIL
      </a>
    </header>
    <main>
      <!-- A trail that runs out: the mark's dot, its path fading to nothing. -->
      <svg class="trail" viewBox="0 0 220 60" aria-hidden="true">
        <path
          d="M8 44 C 40 14, 70 54, 104 30 S 160 10, 176 26"
          fill="none"
          stroke="#2B211C"
          stroke-opacity="0.35"
          stroke-width="3"
          stroke-linecap="round"
          stroke-dasharray="0 10"
        />
        <circle cx="8" cy="44" r="7" fill="#EE6A3F" />
        <circle cx="200" cy="30" r="9" fill="none" stroke="#2B211C" stroke-opacity="0.35" stroke-width="2.5" />
      </svg>
      <p class="code">404 · Page not found</p>
      <h1>This page went dark.</h1>
      <p class="lede">
        Nothing lives at this address. If someone sent you a match, it may not be published on this site.
      </p>
      <div class="actions">
        <a class="button" href="/">Back to the front page</a>
        <a class="button sand" href="/docs">Read the docs</a>
      </div>
    </main>
  </body>
</html>
