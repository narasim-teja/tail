[package]
name = "referee-wasi"
version = "0.1.0"
description = "TAIL referee as an OutLayer WASI P2 component (keys, enrolment, match start, sealed tick state, Handler voice), and natively the local test referee."
edition = "2021"
# Shared crates declare 1.94 so clippy refuses newer std APIs; see rust-toolchain.toml for why.
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "tail-referee"
path = "src/main.rs"

[dependencies]
tail-protocol = { path = "../tail-protocol", features = ["seal"] }
# The rules engine: deterministic, no I/O; this crate unseals, calls it, signs and seals.
referee-core = { path = "../referee-core" }
# Verifies the App Attest attestation at enrolment, and the same P-256 key check the engine
# applies at `start`.
appattest = { path = "../appattest" }
# Refuses a low-order player_box_pk at enrolment (the version tail-protocol's sealing uses).
x25519-dalek = "=2.0.1"
borsh = { version = "=1.8.1", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
hex = "=0.4.3"
# The referee's own blobs (src/vault.rs): log entries and hint facts that only it can open or
# make, and the local test referee's state key. The versions tail-protocol's sealing uses.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = "=0.12.4"
sha2 = { version = "=0.10.9", default-features = false }

# The OutLayer backend (src/host/enclave.rs, src/http/wasi_http.rs).
[target.'cfg(target_family = "wasm")'.dependencies]
outlayer = { version = "=0.2.1", features = ["signing-keys", "encryption-keys"] }
# Raw wasi:http, wasi:clocks and wasi:random: the Handler call needs a real deadline (poll on the
# response and a timer), which wasi-http-client does not offer.
wasi = "=0.13.3"

# The local test referee backend (src/host/local.rs): keys on disk instead of the worker's.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ed25519-dalek = "=2.2.0"
getrandom = "=0.4.3"

# Only the native integration test (tests/local.rs) needs them: P-256 device keys to enrol, and
# App Attest-format assertions over the batches it plays.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
p256 = { version = "=0.14.0", features = ["ecdsa"] }
appattest = { path = "../appattest", features = ["signer"] }

# Mirror of the root workspace lint table (this crate is its own workspace, so it cannot inherit).
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
doc_markdown = "allow"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true

# Its own workspace, excluded from the root one: built for wasm32-wasip2 (OutLayer) and natively
# (the local test referee).
[workspace]
